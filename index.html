<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Secure Notes App</h1>
<div class="password-section">
    <label for="notePassword">Encryption Password:</label>

    <input
        type="password"
        id="notePassword"
        placeholder="Enter a password to protect your note"
        autocomplete="off"
    >
</div>
<textarea
id="noteInput"
placeholder="Write your secure note here..."
rows="8">
</textarea>

<div class="buttons">

<button id="saveBtn">
Save Note
</button>
<button id="unlockBtn">
    Unlock Note
</button>
<button id="deleteBtn">
Delete Note
</button>

</div>

<h2>Saved Note</h2>

<p id="savedNote"></p>

</div>

<script src="script.js"></script>

</body>
</html>
